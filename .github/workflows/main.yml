name: Build and Commit EXE

on:
  # اجرای دستی از تب Actions
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: windows-latest

    permissions:
      contents: write   # برای اینکه بتواند push انجام دهد

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # تاریخچه کامل برای git push

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'   # نسخه مدنظر شما (6.0.x, 7.0.x, ...)

    - name: Restore
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build -c Release --no-restore

    # اگر پروژه شما یک exe قابل اجرا دارد، از dotnet publish استفاده کنید:
    - name: Publish
      run: dotnet publish -c Release -o ./publish

    # مسیر exe را پیدا و به محل دلخواه در مخزن کپی می‌کنیم
    # فرض: exe شما نامش MyApp.exe است
    - name: Copy EXE into repo folder
      run: |
        mkdir exe-output
        copy .\publish\MyApp.exe .\exe-output\MyApp.exe
      shell: pwsh

    # Commit & Push
    - name: Commit and push EXE
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add exe-output/MyApp.exe

        # اگر چیزی برای commit نبود، خطای git جلوگیری می‌شود:
        git diff --cached --quiet && echo "No changes to commit" && exit 0

        git commit -m "Add/update built EXE [skip ci]"
        git push
      env:
        # در صورت نیاز می‌توان از GITHUB_TOKEN استفاده کرد (به طور پیش‌فرض ست شده است)
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
